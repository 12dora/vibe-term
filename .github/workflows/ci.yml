name: CI

on:
  push:
    branches: ['main']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: biome + complexity gate
        run: bun run lint

  bundle-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: build i18n
        run: bun run build:i18n
      - name: build fe
        run: bun run --filter @tmex/fe build
      - name: first-screen gzip budget
        run: bun run --filter @tmex/fe budget

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: tmux (gateway integration tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - run: bun install --frozen-lockfile
      - run: bun run test:unit
