name: CI

on:
  push:
    branches: ['main']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: bun install (retry on registry hiccup)
        run: for i in 1 2 3; do bun install --frozen-lockfile && break || sleep 15; done
      - name: biome + complexity gate
        run: bun run lint

  bundle-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: bun install (retry on registry hiccup)
        run: for i in 1 2 3; do bun install --frozen-lockfile && break || sleep 15; done
      - name: build i18n
        run: bun run build:i18n
      - name: build fe
        run: bun run --filter @vibeterm/fe build
      - name: first-screen gzip budget
        run: bun run --filter @vibeterm/fe budget

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: tmux (gateway integration tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: bun install (retry on registry hiccup)
        run: for i in 1 2 3; do bun install --frozen-lockfile && break || sleep 15; done
      - run: bun run test:unit
        env:
          # GitHub runner 没有可用的 ICE/loopback 候选，真实 node-datachannel 的握手/拨号用例必然失败；本地仍跑。
          VIBETERM_SKIP_RTC_TESTS: '1'
