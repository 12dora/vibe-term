name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check package version matches tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          PKG_VERSION="$(node -p "require('./packages/app/package.json').version")"
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "packages/app version $PKG_VERSION does not match tag version $VERSION"
            exit 1
          fi

      - name: Pack CLI
        working-directory: packages/app
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          npm pack
          bun ../../scripts/release/build-legacy-asset.ts "vibeterm-cli-${VERSION}.tgz"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tarballs
          path: |
            packages/app/vibeterm-cli-${{ steps.tag.outputs.version }}.tgz
            packages/app/tmex-cli-${{ steps.tag.outputs.version }}.tgz
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.build.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarballs
          path: packages/app

      - name: Recompute SHA256SUMS and sign
        env:
          VERSION: ${{ needs.build.outputs.version }}
          VIBETERM_RELEASE_SIGNING_KEY: ${{ secrets.TMEX_RELEASE_SIGNING_KEY }}
        run: |
          cd packages/app
          shasum -a 256 "vibeterm-cli-${VERSION}.tgz" "tmex-cli-${VERSION}.tgz" > SHA256SUMS
          cat SHA256SUMS
          bun ../../scripts/release/sign-sums.ts SHA256SUMS
          cat SHA256SUMS.sig

      - name: Upload signed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-signed
          path: |
            packages/app/vibeterm-cli-${{ needs.build.outputs.version }}.tgz
            packages/app/tmex-cli-${{ needs.build.outputs.version }}.tgz
            packages/app/SHA256SUMS
            packages/app/SHA256SUMS.sig
          if-no-files-found: error

  publish:
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.build.outputs.tag }}

      - name: Download signed artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-signed
          path: packages/app

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TGZ="packages/app/vibeterm-cli-${VERSION}.tgz"
          LEGACY_TGZ="packages/app/tmex-cli-${VERSION}.tgz"
          SUMS="packages/app/SHA256SUMS"
          SIG="packages/app/SHA256SUMS.sig"
          NOTES_ARGS=(--generate-notes)
          if [ -f packages/app/CHANGELOG.md ]; then
            NOTES_ARGS=(--notes-file packages/app/CHANGELOG.md)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            ASSETS="$(gh release view "$TAG" --json assets --jq '.assets | length')"
            if [ "$ASSETS" != "0" ]; then
              echo "release $TAG already has $ASSETS asset(s); refusing to clobber"
              exit 1
            fi
            gh release edit "$TAG" --title "vibeterm-cli ${VERSION}" "${NOTES_ARGS[@]}"
            gh release upload "$TAG" "$TGZ" "$LEGACY_TGZ" "$SUMS" "$SIG"
          else
            gh release create "$TAG" "$TGZ" "$LEGACY_TGZ" "$SUMS" "$SIG" --title "vibeterm-cli ${VERSION}" "${NOTES_ARGS[@]}"
          fi
