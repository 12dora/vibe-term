name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check package version matches tag
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          PKG_VERSION="$(node -p "require('./packages/app/package.json').version")"
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "packages/app version $PKG_VERSION does not match tag version $VERSION"
            exit 1
          fi

      - name: Pack CLI
        working-directory: packages/app
        run: |
          npm pack
          VERSION="${{ steps.tag.outputs.version }}"
          bun ../../scripts/release/build-legacy-asset.ts "vibeterm-cli-${VERSION}.tgz"
          shasum -a 256 "vibeterm-cli-${VERSION}.tgz" "tmex-cli-${VERSION}.tgz" > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS
        env:
          # secret 名沿用改名前的 TMEX_RELEASE_SIGNING_KEY（同一把 r1 私钥，未重建）。
          VIBETERM_RELEASE_SIGNING_KEY: ${{ secrets.TMEX_RELEASE_SIGNING_KEY }}
        run: |
          bun scripts/release/sign-sums.ts packages/app/SHA256SUMS
          cat packages/app/SHA256SUMS.sig

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"
          TGZ="packages/app/vibeterm-cli-${VERSION}.tgz"
          # 桥接资产：≤1.1.40 的节点按旧名下载并硬校验 package.json.name === 'tmex-cli'
          LEGACY_TGZ="packages/app/tmex-cli-${VERSION}.tgz"
          SUMS="packages/app/SHA256SUMS"
          SIG="packages/app/SHA256SUMS.sig"
          NOTES_ARGS=(--generate-notes)
          if [ -f packages/app/CHANGELOG.md ]; then
            NOTES_ARGS=(--notes-file packages/app/CHANGELOG.md)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "vibeterm-cli ${VERSION}" "${NOTES_ARGS[@]}"
            gh release upload "$TAG" "$TGZ" "$LEGACY_TGZ" "$SUMS" "$SIG" --clobber
          else
            gh release create "$TAG" "$TGZ" "$LEGACY_TGZ" "$SUMS" "$SIG" --title "vibeterm-cli ${VERSION}" "${NOTES_ARGS[@]}"
          fi
