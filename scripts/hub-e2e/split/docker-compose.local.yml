name: tmex-split-local

networks:
  nat-a:
    name: tmex-split-local_nat-a
  nat-b:
    name: tmex-split-local_nat-b
  lan:
    name: tmex-split-local_lan

volumes:
  node-a-data:
  node-b-data:

x-tmex-node: &tmex-node
  image: tmex-e2e:split
  init: true
  stop_grace_period: 25s
  cap_add:
    - NET_ADMIN
  extra_hosts:
    - "${VIBETERM_E2E_HUB_HOST:-ai.example.com}:${VIBETERM_E2E_HUB_IP:-4.2.2.1}"
  environment:
    NODE_EXTRA_CA_CERTS: ${VIBETERM_E2E_NODE_CA_CERTS:-/etc/ssl/certs/ca-certificates.crt}

services:
  node-a:
    <<: *tmex-node
    container_name: tmex-split-node-a
    hostname: node-a
    environment:
      NODE_EXTRA_CA_CERTS: ${VIBETERM_E2E_NODE_CA_CERTS:-/etc/ssl/certs/ca-certificates.crt}
      VIBETERM_INSTANCE: node-a
      VIBETERM_E2E_STUN_SERVERS: ${VIBETERM_E2E_STUN_SERVERS:-stun:111.206.174.2:3478,stun:stun.miwifi.com:3478}
      VIBETERM_E2E_TURN_URL: ${VIBETERM_E2E_TURN_URL:-}
      VIBETERM_E2E_TURN_USERNAME: ${VIBETERM_E2E_TURN_USERNAME:-tmex}
      VIBETERM_E2E_TURN_CREDENTIAL: ${VIBETERM_E2E_TURN_CREDENTIAL:-tmex-e2e}
    volumes:
      - node-a-data:/var/lib/tmex
      - ../ca/ca.crt:/ca/ca.crt:ro
    networks:
      - nat-a

  node-b:
    <<: *tmex-node
    container_name: tmex-split-node-b
    hostname: node-b
    environment:
      NODE_EXTRA_CA_CERTS: ${VIBETERM_E2E_NODE_CA_CERTS:-/etc/ssl/certs/ca-certificates.crt}
      VIBETERM_INSTANCE: node-b
      VIBETERM_E2E_STUN_SERVERS: ${VIBETERM_E2E_STUN_SERVERS:-stun:111.206.174.2:3478,stun:stun.miwifi.com:3478}
      VIBETERM_E2E_TURN_URL: ${VIBETERM_E2E_TURN_URL:-}
      VIBETERM_E2E_TURN_USERNAME: ${VIBETERM_E2E_TURN_USERNAME:-tmex}
      VIBETERM_E2E_TURN_CREDENTIAL: ${VIBETERM_E2E_TURN_CREDENTIAL:-tmex-e2e}
    volumes:
      - node-b-data:/var/lib/tmex
      - ../ca/ca.crt:/ca/ca.crt:ro
    networks:
      - nat-b

  driver:
    image: tmex-e2e:split
    container_name: tmex-split-driver
    hostname: driver
    init: true
    working_dir: /workspace
    entrypoint: ["sleep", "infinity"]
    extra_hosts:
      - "${VIBETERM_E2E_HUB_HOST:-ai.example.com}:${VIBETERM_E2E_HUB_IP:-4.2.2.1}"
    environment:
      NODE_EXTRA_CA_CERTS: ${VIBETERM_E2E_NODE_CA_CERTS:-/etc/ssl/certs/ca-certificates.crt}
    volumes:
      - ./out:/out
      - ${VIBETERM_REPO_ROOT:-../../..}:/workspace:ro
      - ../ca/ca.crt:/ca/ca.crt:ro
    networks:
      - nat-a
    healthcheck:
      disable: true
    restart: unless-stopped
