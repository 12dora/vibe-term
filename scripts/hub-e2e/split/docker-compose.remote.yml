name: tmex-split

networks:
  edge:
    name: tmex-split_edge

volumes:
  hub-data:

x-tmex-hub: &tmex-hub
  image: tmex-e2e:split
  platform: linux/amd64
  init: true
  stop_grace_period: 25s
  environment:
    TMEX_INSTANCE: hub
    TMEX_E2E_STUN_SERVERS: ${TMEX_E2E_STUN_SERVERS:-stun:111.206.174.2:3478,stun:stun.miwifi.com:3478}
    TMEX_E2E_TURN_URL: ${TMEX_E2E_TURN_URL:-}
    TMEX_E2E_TURN_USERNAME: ${TMEX_E2E_TURN_USERNAME:-tmex}
    TMEX_E2E_TURN_CREDENTIAL: ${TMEX_E2E_TURN_CREDENTIAL:-tmex-e2e}
    NODE_EXTRA_CA_CERTS: ${TMEX_E2E_NODE_CA_CERTS:-/etc/ssl/certs/ca-certificates.crt}

services:
  caddy:
    image: caddy:2
    platform: linux/amd64
    container_name: tmex-split-caddy
    ports:
      - "0.0.0.0:${TMEX_E2E_HUB_PORT:-18443}:443"
    volumes:
      - ${TMEX_E2E_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${TMEX_E2E_TLS_CERT:-${TMEX_E2E_REMOTE_DIR:-/root/tmex-e2e}/certs/fullchain.pem}:/certs/fullchain.pem:ro
      - ${TMEX_E2E_TLS_KEY:-${TMEX_E2E_REMOTE_DIR:-/root/tmex-e2e}/certs/privkey.pem}:/certs/privkey.pem:ro
    networks:
      edge:
        aliases:
          - ${TMEX_E2E_HUB_HOST:-ai.example.com}
    depends_on:
      hub:
        condition: service_healthy
    restart: unless-stopped

  hub:
    <<: *tmex-hub
    container_name: tmex-split-hub
    hostname: hub
    ports:
      - "39001:39001"
    volumes:
      - hub-data:/var/lib/tmex
      - ${TMEX_E2E_CA_CRT:-/etc/ssl/certs/ca-certificates.crt}:/ca/ca.crt:ro
    networks:
      - edge

  turn:
    image: coturn/coturn:latest
    container_name: tmex-split-turn
    network_mode: host
    restart: unless-stopped
    command: >
      --listening-port=3478 --min-port=49160 --max-port=49200
      --external-ip=${TMEX_E2E_TURN_EXTERNAL_IP:-${TMEX_E2E_HUB_IP:-4.2.2.1}}
      --realm=tmex --user=${TMEX_E2E_TURN_USERNAME:-tmex}:${TMEX_E2E_TURN_CREDENTIAL:-tmex-e2e}
      --lt-cred-mech --fingerprint --no-tls --no-dtls --no-cli --log-file=stdout
