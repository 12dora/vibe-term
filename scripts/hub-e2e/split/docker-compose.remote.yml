name: vibeterm-split

networks:
  edge:
    name: vibeterm-split_edge

volumes:
  hub-data:

x-vibeterm-hub: &vibeterm-hub
  image: vibeterm-e2e:split
  platform: linux/amd64
  init: true
  stop_grace_period: 25s
  environment:
    VIBETERM_INSTANCE: hub
    VIBETERM_E2E_STUN_SERVERS: ${VIBETERM_E2E_STUN_SERVERS:-stun:111.206.174.2:3478,stun:stun.miwifi.com:3478}
    VIBETERM_E2E_TURN_URL: ${VIBETERM_E2E_TURN_URL:-}
    VIBETERM_E2E_TURN_USERNAME: ${VIBETERM_E2E_TURN_USERNAME:-vibeterm}
    VIBETERM_E2E_TURN_CREDENTIAL: ${VIBETERM_E2E_TURN_CREDENTIAL:-vibeterm-e2e}
    NODE_EXTRA_CA_CERTS: ${VIBETERM_E2E_NODE_CA_CERTS:-/etc/ssl/certs/ca-certificates.crt}

services:
  caddy:
    image: caddy:2
    platform: linux/amd64
    container_name: vibeterm-split-caddy
    ports:
      - "0.0.0.0:${VIBETERM_E2E_HUB_PORT:-18443}:443"
    volumes:
      - ${VIBETERM_E2E_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${VIBETERM_E2E_TLS_CERT:-${VIBETERM_E2E_REMOTE_DIR:-/root/vibeterm-e2e}/certs/fullchain.pem}:/certs/fullchain.pem:ro
      - ${VIBETERM_E2E_TLS_KEY:-${VIBETERM_E2E_REMOTE_DIR:-/root/vibeterm-e2e}/certs/privkey.pem}:/certs/privkey.pem:ro
    networks:
      edge:
        aliases:
          - ${VIBETERM_E2E_HUB_HOST:-ai.example.com}
    depends_on:
      hub:
        condition: service_healthy
    restart: unless-stopped

  hub:
    <<: *vibeterm-hub
    container_name: vibeterm-split-hub
    hostname: hub
    ports:
      - "39001:39001"
    volumes:
      - hub-data:/var/lib/vibeterm
      - ${VIBETERM_E2E_CA_CRT:-/etc/ssl/certs/ca-certificates.crt}:/ca/ca.crt:ro
    networks:
      - edge

  turn:
    image: coturn/coturn:latest
    container_name: vibeterm-split-turn
    network_mode: host
    restart: unless-stopped
    command: >
      --listening-port=40000 --min-port=40001 --max-port=40049
      --external-ip=${VIBETERM_E2E_TURN_EXTERNAL_IP:-${VIBETERM_E2E_HUB_IP:-4.2.2.1}}
      --realm=vibeterm --user=${VIBETERM_E2E_TURN_USERNAME:-vibeterm}:${VIBETERM_E2E_TURN_CREDENTIAL:-vibeterm-e2e}
      --lt-cred-mech --fingerprint --no-tls --no-dtls --no-cli --log-file=stdout
